# Render "Blueprint": tells Render how to build and run the site (free plan).
services:
  - type: web
    name: your-next-step
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
